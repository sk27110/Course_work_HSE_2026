# configs/resnet18_genmix_aug1.yaml

experiment_name: resnet18_genmix_aug1
seed: 42
device: cuda

data:
  train_dataset_type: mixed_aug
  root: data/flowers102
  download: true

  aug_root: augmented_train
  aug_index_path: augmented_train/dataset_index.json

  num_aug_per_image: 1

  # Если alpha=1.0, на train всегда берется одна из доступных аугментаций.
  # Если alpha=0.5, половина эпох в среднем будет original, половина augmentation.
  alpha: 1.0

  num_classes: 102
  batch_size: 32
  num_workers: 4

model:
  name: resnet18
  pretrained: true

training:
  num_epochs: 50
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001

  scheduler:
    type: step_lr
    step_size: 20
    gamma: 0.1

logging:
  log_dir: logs
  log_batch_loss: false

  comet:
    project_name: OF102-augmentation-comparison
    workspace: null
    api_key: MbL2psOHT82Uc7ML5Cd7TSvmR
    disabled: false
