# configs/miniimagenet_resnet18_5shot_genmix_aug1.yaml

experiment_name: miniimagenet_resnet18_5shot_genmix_aug1
seed: 42
device: cuda

data:
  dataset_name: miniimagenet
  train_dataset_type: mixed_aug

  root: data/miniimagenet
  download: true

  few_shot:
    enabled: true
    k: 5
    seed: 42
    indices_path: fewshot_indices/miniimagenet_5shot_seed42.json

  aug_root: augmented_miniimagenet_5shot_seed42_genmix_aug1
  aug_index_path: augmented_miniimagenet_5shot_seed42_genmix_aug1/dataset_index.json

  num_aug_per_image: 1
  alpha: 0.5

  num_classes: 100
  batch_size: 32
  num_workers: 4

model:
  name: resnet18
  pretrained: true

training:
  num_epochs: 50
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001

  scheduler:
    type: step_lr
    step_size: 20
    gamma: 0.1

logging:
  log_dir: logs
  log_batch_loss: false

  comet:
    project_name: MiniImageNet-fewshot-augmentation-comparison
    workspace: null
    api_key_env: COMET_API_KEY
    disabled: true
